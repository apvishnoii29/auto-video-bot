name: post-video
on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "30 8 * * *"
    - cron: "0 11 * * *"
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      niche:
        description: "school or class"
        required: false
        default: ""
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: pip install edge-tts deep-translator requests google-api-python-client google-auth
      - run: python bot.py
        env:
          NICHE: ${{ github.event.inputs.niche || ((github.event.schedule == '30 8 * * *' || github.event.schedule == '30 13 * * *') && 'school' || 'class') }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
